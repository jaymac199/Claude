name: Deploy travel-globe to GitHub Pages

on:
  push:
    branches: [claude/serene-planck-k41whw]
    paths:
      - 'travel-globe/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (with GitHub Actions as the source) if it isn't already.
          enablement: true

      - name: Upload site artifact (./travel-globe)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./travel-globe

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
