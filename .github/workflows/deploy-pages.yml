name: Deploy site to GitHub Pages

# Publishes a combined site:
#   /            -> travel-globe (static)
#   /stock-monitor/ -> stock-monitor (built Vite app)
on:
  push:
    branches:
      - claude/serene-planck-k41whw
      - claude/amazing-sagan-9rq4ab
    paths:
      - 'travel-globe/**'
      - 'stock-monitor/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stock-monitor/package-lock.json

      - name: Build stock-monitor
        working-directory: stock-monitor
        env:
          # Served under the repo's project-pages subpath.
          VITE_BASE: /Claude/stock-monitor/
          # Optional: set a repo secret named MARKET_DATA_API_KEY for live data;
          # without it the deployed app runs on demo data.
          VITE_MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
        run: |
          npm ci
          npm run build

      - name: Assemble combined site
        run: |
          rm -rf _site
          mkdir -p _site/stock-monitor
          cp -r travel-globe/. _site/
          cp -r stock-monitor/dist/. _site/stock-monitor/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (with GitHub Actions as the source) if it isn't already.
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
